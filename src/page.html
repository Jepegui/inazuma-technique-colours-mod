<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Technique Colours</title>
<style>
@font-face { font-family:'TC Pointy'; src:url(data:font/woff2;base64,/*FONT:RumRaisin*/) format('woff2'); font-weight:400; }
@font-face { font-family:'TC Lilita'; src:url(data:font/woff2;base64,/*FONT:LilitaOne*/) format('woff2'); font-weight:400; }
@font-face { font-family:'TC Chewy'; src:url(data:font/woff2;base64,/*FONT:Chewy*/) format('woff2'); font-weight:400; }
@font-face { font-family:'TC Spicy'; src:url(data:font/woff2;base64,/*FONT:SpicyRice*/) format('woff2'); font-weight:400; }
@font-face { font-family:'TC Titan'; src:url(data:font/woff2;base64,/*FONT:TitanOne*/) format('woff2'); font-weight:400; }
@font-face { font-family:'TC Bangers'; src:url(data:font/woff2;base64,/*FONT:Bangers*/) format('woff2'); font-weight:400; }
@font-face { font-family:'TC Luckiest'; src:url(data:font/woff2;base64,/*FONT:LuckiestGuy*/) format('woff2'); font-weight:400; }
:root { --bg:#0f1524; --panel:#182033; --panel2:#1f2940; --line:#2c3854; --text:#e8edf7; --dim:#93a0bb; --acc:#ffb800; --blue:#3fa2ff; --ok:#3ccf7a; --err:#ff6b6b; }
* { box-sizing:border-box; } [hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI", system-ui, sans-serif; }
header { padding:14px 22px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:baseline; }
header select { width:auto; margin-left:auto; padding:5px 8px; }
header b { font-size:20px; } header span { color:var(--dim); }
main { display:grid; grid-template-columns:340px 1fr; gap:16px; padding:16px 22px; height:calc(100vh - 58px); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; min-height:0; }
aside { display:flex; flex-direction:column; gap:10px; }
input[type=search], select { width:100%; background:#0b1120; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
#list { flex:1; overflow:auto; display:flex; flex-direction:column; gap:4px; }
.row { padding:7px 10px; border-radius:8px; background:var(--panel2); cursor:pointer; border:1px solid transparent; display:flex; justify-content:space-between; gap:8px; }
.row:hover { border-color:var(--line); } .row.on { border-color:var(--acc); }
.row small { color:var(--dim); white-space:nowrap; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
button { font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text); padding:8px 14px; cursor:pointer; }
button.primary { background:var(--acc); color:#1a1300; border-color:var(--acc); font-weight:700; }
button.danger { color:var(--err); }
button:disabled { opacity:.5; cursor:default; }
section { display:flex; flex-direction:column; gap:14px; overflow:auto; }
.grid { display:grid; grid-template-columns:auto 1fr auto; gap:10px 14px; align-items:center; max-width:640px; }
.grid label { color:var(--dim); }
input[type=range] { width:100%; }
input[type=color] { width:64px; height:40px; border:none; background:none; padding:0; }
canvas { border-radius:10px; border:1px solid var(--line); max-width:100%; }
.status { padding:8px 12px; border-radius:8px; background:var(--panel2); }
.status.ok { color:var(--ok); } .status.err { color:var(--err); }
.hint { color:var(--dim); font-size:13px; max-width:760px; }
.modbar { display:grid; grid-template-columns:1fr auto auto; gap:6px; align-items:end; }
.modbar label { display:grid; gap:4px; font-size:12px; color:var(--dim); }
.modbar select { min-width:0; font-weight:600; }
#changes .row { cursor:default; align-items:center; }
h3 { margin:0 0 4px; font-size:15px; }
.empty { color:var(--dim); text-align:center; margin:auto; }
  a { color: #7cc4ff; }
  .vwarn { max-width: 760px; padding: 10px 14px; border-radius: 8px; border: 1px solid #f5b301; background: rgba(245, 179, 1, .12); color: #ffd666; font-weight: 600; }
</style>
</head>
<body>
<header><b>Technique Colours</b><span id="sub"></span><select id="lang"><option value="en">English</option><option value="pt">Português</option><option value="es">Español</option></select></header>
<main>
  <aside class="panel">
    <button id="pick" class="primary"></button>
    <div id="where" class="hint"></div>
    <div class="modbar" id="modbar" hidden><label><span id="modlbl"></span><select id="modpick"></select></label><button id="modnew"></button><button id="modren"></button></div>
    <div id="pfwarn" class="vwarn"></div>
    <input id="search" type="search">
    <select id="cat"></select>
    <div id="list"></div>
  </aside>
  <section class="panel">
    <div id="editor"></div>
    <div>
      <h3 id="yours"></h3>
      <div id="changes" style="display:flex;flex-direction:column;gap:4px"></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button id="write" class="primary" disabled></button>
      <span class="hint" id="writehint"></span>
    </div>
    <div id="status" class="status" hidden></div>
    <p class="hint" id="about"></p>
  </section>
</main>

const hexToHsv = h => { const n = parseInt(h.slice(1), 16); return rgbToHsv((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255); };

// ---------- the name banner (telop): the name in the cut-in, one picture for every language
// The game's telop is a 1728x352 picture; VRFW takes a PNG of the mod for a move with a `key`.
const TELOP_W = 1728, TELOP_H = 352;
// colours by element: gradient top/mid/bottom, outline, the 3D edge behind
const TELOP_STYLE = {
  fire:     { g: ['#8c2301', '#fc7606'], line: '#ffd88a', edge: '#3a0c04' },
  mountain: { g: ['#9b4500', '#e7a403'], line: '#ffeeb0', edge: '#2e1806' },
  wind:     { g: ['#0247c0', '#04ccfe'], line: '#bff7ff', edge: '#04123a' },
  forest:   { g: ['#4ba202', '#bff723'], line: '#f4ffc4', edge: '#0b2806' },
  void:     { g: ['#3f0161', '#bb44ee'], line: '#f8eeff', edge: '#16042c' },

function drawTelop(c, text, element, family, weight = '400', squash = 0.9) {

  else if (!fantasy) status(T('Folder connected, but it has no Inazuma Fantasy: the moves are made, but without its shop there is nowhere to buy them.'), 'err');
  else status(T('Mods folder connected.'), 'ok');
  await loadMods(); renderChanges(); $('#write').disabled = false;
};
// the ids of a move's own cut-ins: ev<NN>_<5 digits> in the mod's block of 500 (50000-69999; the Fantasy uses 70000+ and 80000+)
const evId = (t, fail) => { const n = 50000 + state.block * 500 + ((t.n * 2 + (fail ? 1 : 0)) % 500); return [t.ev.slice(0, 4), String(n)]; };
$('#write').onclick = async () => {
  if (!root) return;
  try {
    const desc = 'Special moves recoloured with the Technique Colours app, sold in the Technique Shop.';
    const date = new Date().toISOString().slice(0, 10), num = x => (+x).toFixed(3);
    await writeAt(`${MOD}/mod.toml`, `id = "${MOD}"\nname = ${tstr(modName())}\nversion = "1.0.${state.next}"\nauthor = "local"\ndescription = ${tstr(desc)}\npriority = 0\ntype = "content"\ntags = []\nupdated = "${date}"\nprefix = "${MOD}"\nfolder = "${MOD}"\nrequires = ["VRFW>=0.3.0"]\noptional = ["InazumaFantasy"]\nconflicts = []\n# starts switched OFF: turned on in the Mods screen\ndefault_enabled = false\n${TAG}${JSON.stringify(state)}\n`);
    await writeAt(`${MOD}/text/keys.toml`, `schema = "VRFW.text_key/1"\ndefault_lang = "en"\n` + LANGS.map(l => `\n[${l}.new]\nmod_name = ${tstr(modName())}\nmod_description = ${tstr(desc)}\n`).join(''));
    await writeAt(`${MOD}/changelog.toml`, `schema = "VRFW.changelog/1"\n\n[[release]]\nicon = "general"\nnotes = [\n    "Recoloured moves: ${state.techs.length}",\n]\n`);
    let anims = `schema = "VRFW.anim/2"\nowner = "match"\n# each move's own cut-in(s): a copy of the original's\n`;
    let fx = `schema = "VRFW.effect/1"\n# each move's effect object: a recoloured copy, loaded by its own cut-in(s)\n`;
    let tech = `schema = "VRFW.technique/3"\n# copies of the game's moves with their effect recoloured (power, TP and element: the original's unless written here)\n`;
    let shop = `schema = "VRFW.shop/2"\n\n[[edit]]\ntarget = "InazumaFantasy.technique_shop"\n`;
    let chars = `schema = "VRFW.character/2"\ndefault_lang = "en"\n# each recoloured 3D figure's model row: the game finds a figure by its name in its model table (chara_model)\n`, nChars = 0;
    for (const t of state.techs) {
      const name = techName(t), evs = [[t.ev, false], ...(t.fail ? [[t.fail, true]] : [])].map(([from, fail]) => { const [pre, id] = evId(t, fail); return { from, fail, id: `${pre}_${id}`, stem: `${pre}${id}0`, name: name + (fail ? '_fail' : '') }; });
      const stem = evs[0].stem, pre = t.ev.slice(0, 4), base = baseOf(t.k) || {};
      // the effects' grey pixels stay as they are (mask_saturation): many effects use grey (and some coloured) textures as masks,
      // not colours (the «ThresholdGrd» materials read a value there to pick a colour from a gradient: Royal Shield's walls got
      // short or vanished when their grey noise was tinted); the 3D figures' grey parts take the colour as before
      const colourOf = (hex, greys) => `hue = ${hexToHsv(hex)[0].toFixed(1)}\nmode = "set"\nsaturation = ${num(t.sat * colourAmount(hex))}\nvalue = ${num(t.val)}\ncolorize = ${num(t.colorize * colourAmount(hex))}\n${t.light ? `brightness = ${num(t.light)}\n` : ''}${t.keepWhites !== false ? 'keep_whites = 0.92\n' : ''}${greys ? '' : 'mask_saturation = [0.08, 1.0]\n'}`;
      const colour = colourOf(t.color), model = t.model || {}, xtr = t.extra || {};
      const modelColour = colourOf(model.own && model.color ? model.color : t.color, true), extraColour = colourOf(xtr.own && xtr.color ? xtr.color : t.color);
      // its colour groups: the textures of a group kept original are left out; a group of its own colour: per_texture
      const tg = TEX_GROUPS[t.k] || [], gm = groupsOf(t), kept = tg.filter((g, i) => gm[i].mode === 'orig');
      const texSel = kept.length ? `[${tg.filter((g, i) => gm[i].mode !== 'orig').flatMap(g => g[3]).map(x => `"${t.obj}_${x}"`).join(', ')}]` : '"all"';
      const mainKept = tg.length && gm[0].mode === 'orig';   // the main group kept: materials, vertex colours and particles (mostly its colour) stay too
      fx += `\n# ${t.name} (from ${t.en}, ${t.k})\n[[recolor]]\nobject = "${t.obj}"\ncopy = "${stem}"\ntextures = ${texSel}\nmaterials = "${mainKept ? 'none' : 'all'}"\n${mainKept ? '' : 'vertex_colors = "all"\nparticles = true\n'}${colour}`;
      tg.forEach((g, i) => { const own = gm[i]; if (own.mode !== 'own' || !own.color) return;
        const [h] = hexToHsv(own.color), ca = colourAmount(own.color), dv = darkness(own.color);
        for (const x of g[3]) fx += `  [recolor.per_texture."${t.obj}_${x}"]\n  hue = ${h.toFixed(1)}\n  saturation = ${num(t.sat * ca)}\n  value = ${num(t.val * dv)}\n`; });
      // the cut-ins' other effect objects (ev60100901, ev60004100_wingfire …): copies named after the move's own stem
      const extra = (xtr.on === false ? [] : base.x || []).map((o, i) => ({ o, copy: `${pre}${String(50000 + state.block * 500 + ((t.n * 4 + i) % 500))}${o.slice(9)}` }));   // the same length and ending
      for (const x of extra) fx += `\n[[recolor]]\nobject = "${x.o}"\ncopy = "${x.copy}"\ntextures = "all"\nmaterials = "all"\nvertex_colors = "all"\nparticles = true\n${extraColour}`;
      // the 3D props of the cut-ins (dragons, penguins, giants …: chr/_waza models): copies of the same length
      const props = (model.on === false || !PROPS_ON ? [] : base.pr || []).map(([p, seats], i) => {
        const n = 30000 + state.block * 500 + ((t.n * 4 + i) % 500);   // 3xxxx-4xxxx: apart from the cut-ins' own ids (5xxxx-6xxxx) and the game's
        return { p, seats, copy: p.startsWith('ev') ? `${p.slice(0, 5)}${n}` : `${p[0]}${String(n * 10).slice(0, p.length - 1)}` };
      });
      // (a prop is named by its objbin path under common/: VRFW does not find it by its stem)
      // (its textures and materials: the outline colour of some figures, as Majin Merge's, is in their materials; vertex colours stay)
      for (const x of props) fx += `\n[[recolor]]\nobject = "chr/_waza/${x.p}/${x.p}.objbin"\ncopy = "${x.copy}"\ntextures = "all"\nmaterials = "all"\n${modelColour}`;
      // and its row in the model table: the original's, with the copy's skeleton (objbin)
      for (const x of props) { nChars++; chars += `\n[[character]]\nname = "model_${x.copy}"    # ${t.name}: ${x.p}\nbased_on = "${x.p}"\nbattle = false\n  [character.base]\n  id = ${hex32(crc32(x.copy))}\n  name = "${x.copy}"\n  [character.new_model]\n  id = ${hex32(crc32(x.copy + '_model'))}\n  from = "${x.p}"\n  [character.new_model.cells]\n  skeleton_path = "_waza/${x.copy}/${x.copy}.objbin"\n`; }
      for (const e of evs) {
        anims += `\n[[event]]\nname = "${e.name}"\nfrom = "${e.from}"\nid = "${e.id}"\n`;
        fx += `\n[[event_command]]\nevent = "${e.id}"\ncommand = "CMD_799A1EBA"                 # LOAD_ACTOR_RESOURCE\nargs = ["${t.obj}"]\nset = ["${t.obj}", "common/effect/event/${pre}/${stem}/${stem}.objbin"]\n`;
        for (const x of extra) for (const a of [x.o, ...(/^ev\d{8}$/.test(x.o) ? [1, 2, 3, 4, 5, 6].map(k => `${x.o}_${k}`) : [])])
          fx += `\n[[event_command]]\nevent = "${e.id}"\ncommand = "CMD_799A1EBA"\nargs = ["${a}"]\nset = ["${a}", "common/effect/event/${pre}/${x.copy}/${x.copy}.objbin"]\n`;
        // the props are loaded in the cut-in's evt list (its eff list has only the effect objects)
        for (const x of props) for (const [ev, seat] of x.seats) if (ev === e.from) {
          const actor = `${x.p}_s${seat}_p<VARIATION>`;
          fx += `\n[[event_command]]\nevent = "${e.id}"\nlist = "evt"\ncommand = "CMD_799A1EBA"\nargs = ["${actor}", "${x.p}"]\nset = ["${actor}", "${x.copy}"]\n`;
        }
        // the copied cut-in loads the original's name banner: its own instead (the telop of the move's key)
        if (t.key) fx += `\n[[event_command]]\nevent = "${e.id}"\nlist = "evt"\ncommand = "CMD_D23AD08F"                 # TELOP_OBJ_LOAD\nset = ["soccer10_01_${t.key}"]\n`;
      }
      tech += `\n[[technique]]\nname = "${name}"\n${t.key ? `key = "${t.key}"\n` : ''}base = "${t.k}"\nmanual = true\nevent = "${MOD}.${evs[0].name}"\n${t.fail ? `fail_event = "${MOD}.${evs[1].name}"\n` : ''}${t.element ? `element = "${t.element}"\n` : ''}${strengthToml(t)}description_text = "base"\n` + LANGS.map(l => `  [technique.text.${l}]\n  name = ${tstr(t.name)}\n`).join('');
      shop += `\n  [[edit.entry]]\n  technique = "${MOD}.${name}"    # ${t.name}\n  price = ${t.price}\n  currency = "tk_bb000001"\n`;
    }
    const files = { 'content/anims/technique_colours.toml': anims, 'content/effects/technique_colours.toml': fx, 'content/techniques/technique_colours.toml': tech, 'addons/InazumaFantasy/content/shops/technique_colours.toml': shop, 'content/characters/technique_colours_models.toml': nChars ? chars : '' };
    // the name banners: one picture per move (in every language), for the moves that have a key
    const withKey = state.techs.filter(t => t.key);
    files['content/telops/any/telops.toml'] = withKey.length ? `schema = "VRFW.telop_list/2"\n` + withKey.map(t => `\n[[telop]]\nid = "${t.key}"    # ${t.name}\nfrom = "${t.k}"\n`).join('') : '';
    if (customFont) await writeAt(`${MOD}/${CUSTOM_FONT}`, customFont.data);
    const noFont = withKey.filter(t => t.font === 'custom' && !customFont);
    for (const t of withKey) await writeAt(`${MOD}/content/telops/any/${t.key}.png`, await telopBlob(t.name, t.element || (baseOf(t.k) || {}).el, t.font));
    try { const d = await dirAt([MOD, 'content', 'telops', 'any']), keep = new Set(withKey.map(t => t.key + '.png')), old = []; for await (const [n] of d.entries()) if (n.endsWith('.png') && !keep.has(n)) old.push(n); for (const n of old) await d.removeEntry(n); } catch (e) { /* none */ }
    for (const [p, text] of Object.entries(files)) {
      if (text && state.techs.length) await writeAt(`${MOD}/${p}`, text);
      else { try { const parts = p.split('/'); await (await dirAt([MOD, ...parts.slice(0, -1)])).removeEntry(parts.at(-1)); } catch (e) { /* not there */ } }
    }
    status(T('Mod generated in mods\\{mod} with {n} move(s). Switch «{name}» on in the launcher; they are sold in Inazuma Fantasy\'s Technique Shop.', { mod: MOD, n: state.techs.length, name: modName() }), 'ok');
    if (noFont.length) status(T('Mod generated, but your own font file is missing: {names} got the default font. Choose the file again in one of them and generate the mod.', { names: noFont.map(t => '«' + t.name + '»').join(', ') }), 'err');
  } catch (e) { console.error(e); status(T('Could not write: ') + e.message, 'err'); }
};
$('#search').addEventListener('input', renderList); $('#cat').addEventListener('change', renderList);
applyLang();
</script>
